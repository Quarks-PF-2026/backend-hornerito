name: CI

# Gate de integración del backend. Los tres niveles de test corren acá
# (CLAUDE.md §2). El token HN_TEST_GATE=ci es el que habilita a correr la
# suite: el hook que la bloquea en el thread principal no aplica en CI, pero
# usamos el mismo token para que el comando sea idéntico en los dos lados y
# nadie tenga que recordar dos formas de invocarlo.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # NO BLOQUEANTE, a propósito: al 2026-08-15 el repo tiene 15 errores de
    # ESLint preexistentes (decoradores de auth, `require-await` en cuatro
    # .spec, un `no-unused-vars`). Ninguno viene del stack de agentes.
    #
    # Se dejan visibles en vez de silenciarlos con `--fix` o bajando reglas:
    # el CI los reporta en cada corrida y no deja mergear en falso verde.
    # Se vuelve bloqueante cuando la deuda 10 de PROYECTO.md esté saldada.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Sin --fix: en CI queremos ver el error, no arreglarlo en un working
      # tree que se descarta. `npm run lint` sí lleva --fix, para uso local.
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"

  unit:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: HN_TEST_GATE=ci npm run test:unit

  integration:
    name: Tests de integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hornerito
          POSTGRES_PASSWORD: hornerito
          POSTGRES_DB: hornerito_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hornerito -d hornerito_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hornerito:hornerito@localhost:5433/hornerito_test
      JWT_SECRET: ci-secret-no-usar-en-produccion
      JWT_EXPIRES_IN_SECONDS: '3600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Las migraciones las aplica el AppModule al bootstrapear
      # (migrationsRun: true), así que no hace falta un paso previo.
      - run: HN_TEST_GATE=ci npm run test:integration

  acceptance:
    name: Tests de aceptación (ATDD)
    runs-on: ubuntu-latest
    # NO BLOQUEANTE EN ESTA ITERACIÓN, a propósito: las historias ya
    # implementadas (QK-12, 13, 15, 17, 26) todavía no tienen escenario de
    # aceptación, así que la cobertura real es parcial y un rojo acá no
    # significa que el cambio esté mal.
    #
    # Se vuelve bloqueante cuando se cierre la deuda 1 de PROYECTO.md.
    # Cuando eso pase: borrar esta línea y agregar el job a los checks
    # requeridos de la rama en la config del repo.
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hornerito
          POSTGRES_PASSWORD: hornerito
          POSTGRES_DB: hornerito_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hornerito -d hornerito_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hornerito:hornerito@localhost:5433/hornerito_test
      JWT_SECRET: ci-secret-no-usar-en-produccion
      JWT_EXPIRES_IN_SECONDS: '3600'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: HN_TEST_GATE=ci npm run test:acceptance

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
